<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzureGuessr — Multiplayer Geo Quiz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f23;--bg2:#1a1a2e;--card:#16213e;--azure:#0078d4;
  --green:#57a773;--red:#e74856;--yellow:#ffd93d;--orange:#f7941d;
  --text:#e0e0e0;--text-dim:#8888aa;--radius:12px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:transform .1s,box-shadow .15s}
button:active{transform:scale(.96)}
input,select{font-family:inherit;outline:none}

/* SCREENS */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;transform:translateY(20px);z-index:1}
.screen.active{opacity:1;pointer-events:auto;transform:translateY(0);z-index:10}

/* WELCOME */
#welcome{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)}
.logo{font-size:3rem;font-weight:900;letter-spacing:-2px;margin-bottom:.2em;text-align:center}
.logo span{color:var(--azure)}
.logo-sub{color:var(--text-dim);font-size:1rem;margin-bottom:2em;text-align:center}
.welcome-card{background:var(--card);padding:2em;border-radius:var(--radius);width:min(400px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.welcome-card input{width:100%;padding:.8em 1em;border-radius:8px;border:2px solid #333;background:#0d1117;color:#fff;font-size:1rem;margin-bottom:1em}
.welcome-card input:focus{border-color:var(--azure)}
.btn-row{display:flex;gap:.8em}
.btn-primary{flex:1;padding:.8em;border-radius:8px;background:var(--azure);color:#fff;font-size:1rem;font-weight:700}
.btn-primary:hover{box-shadow:0 4px 20px rgba(0,120,212,.4)}
.btn-secondary{flex:1;padding:.8em;border-radius:8px;background:#2a2a4a;color:#fff;font-size:1rem;font-weight:700;border:2px solid #444}
.btn-secondary:hover{border-color:var(--azure)}
.btn-solo{margin-top:.8em;width:100%;padding:.6em;border-radius:8px;background:transparent;color:var(--text-dim);font-size:.85rem;border:1px solid #333}
.room-input{display:none;margin-top:.5em}
.room-input.show{display:block}
.room-input input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:1.4rem;font-weight:700}

/* LOBBY */
#lobby{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)}
.lobby-container{width:min(600px,92vw);text-align:center}
.room-code-display{font-size:3.5rem;font-weight:900;letter-spacing:12px;color:var(--azure);cursor:pointer;user-select:all;margin:.3em 0;transition:transform .15s}
.room-code-display:hover{transform:scale(1.05)}
.room-code-label{color:var(--text-dim);font-size:.9rem}
.copied-toast{color:var(--green);font-size:.8rem;height:1.2em;transition:opacity .3s;opacity:0}
.copied-toast.show{opacity:1}
.mode-selector{display:flex;gap:.5em;margin:1.2em 0;justify-content:center;flex-wrap:wrap}
.mode-btn{padding:.5em 1.2em;border-radius:20px;background:#222;color:var(--text-dim);font-size:.85rem;border:2px solid transparent;transition:all .2s}
.mode-btn.active{border-color:var(--azure);color:#fff;background:rgba(0,120,212,.15)}
.player-list{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center;margin:1.5em 0;min-height:60px}
.player-chip{display:flex;align-items:center;gap:.5em;background:var(--card);padding:.5em 1em;border-radius:30px;animation:chipIn .4s ease-out}
@keyframes chipIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0}
.player-count{color:var(--text-dim);font-size:.85rem;margin-bottom:.5em}
.lobby-actions{margin-top:1em;display:flex;gap:.8em;justify-content:center}
.btn-start{padding:.8em 2.5em;border-radius:8px;background:var(--green);color:#fff;font-size:1.1rem;font-weight:700}
.btn-start:disabled{opacity:.4;cursor:not-allowed}
.btn-leave{padding:.8em 1.5em;border-radius:8px;background:var(--red);color:#fff;font-size:.9rem;font-weight:600}

/* GAME */
#game{flex-direction:row;background:var(--bg)}
#map-container{flex:1;height:100%;position:relative}
#map{width:100%;height:100%}
.round-badge{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);padding:.5em 1.2em;border-radius:20px;font-weight:700;z-index:500;font-size:1rem}
.timer-container{position:absolute;top:16px;right:16px;z-index:500}
.timer-ring{width:80px;height:80px}
.timer-ring circle{fill:none;stroke-width:4}
.timer-bg{stroke:#333}
.timer-fg{stroke:var(--azure);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer-fg.danger{stroke:var(--red);animation:timerPulse .5s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900}
.answer-panel{width:340px;height:100%;background:var(--card);padding:1.2em;display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid #2a2a4a}
.answer-panel h3{margin-bottom:.8em;font-size:1rem;color:var(--text-dim)}
.answer-field{margin-bottom:.7em;opacity:.3;pointer-events:none;transform:translateX(20px);transition:opacity .3s,transform .3s}
.answer-field.unlocked{opacity:1;pointer-events:auto;transform:translateX(0)}
.answer-field.correct .field-status{color:var(--green)}
.answer-field.wrong .field-status{color:var(--red)}
.answer-field label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:.3em}
.answer-field select,.answer-field input{width:100%;padding:.6em .8em;border-radius:6px;border:2px solid #333;background:#0d1117;color:#fff;font-size:.95rem}
.answer-field select:focus,.answer-field input:focus{border-color:var(--azure)}
.answer-field.correct select,.answer-field.correct input{border-color:var(--green);background:rgba(87,167,115,.1)}
.answer-field.wrong select,.answer-field.wrong input{border-color:var(--red);background:rgba(231,72,86,.1)}
.field-status{font-size:.75rem;margin-top:.2em;height:1em}
.btn-submit{width:100%;padding:.7em;border-radius:8px;background:var(--azure);color:#fff;font-size:1rem;font-weight:700;margin-top:auto}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.mini-scores{margin-top:.8em;border-top:1px solid #2a2a4a;padding-top:.6em}
.mini-scores h4{font-size:.8rem;color:var(--text-dim);margin-bottom:.4em}
.mini-score-row{display:flex;align-items:center;gap:.4em;padding:.2em 0;font-size:.8rem}
.mini-score-row .avatar{width:22px;height:22px;font-size:.6rem}
.points-popup{position:fixed;pointer-events:none;font-size:1.5rem;font-weight:900;color:var(--green);z-index:9999;animation:popUp 1.2s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}

/* RESULTS */
#results{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)}
.results-container{width:min(600px,92vw);text-align:center}
.results-container h2{margin-bottom:.3em}
.results-container .round-label{color:var(--text-dim);margin-bottom:1.2em;font-size:.9rem}
.result-row{display:flex;align-items:center;gap:.8em;background:var(--card);padding:.7em 1em;border-radius:8px;margin-bottom:.5em;animation:slideIn .4s ease-out backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}}
.result-pos{font-size:1.3rem;font-weight:900;width:30px;text-align:center}
.result-info{flex:1;text-align:left}
.result-name{font-weight:600}
.result-answer{font-size:.8rem;color:var(--text-dim)}
.result-points{font-weight:700;font-size:1.1rem;color:var(--yellow)}
.result-total{font-size:.8rem;color:var(--text-dim)}
.pos-change{font-size:.75rem;width:30px;text-align:center}
.pos-up{color:var(--green)}
.pos-down{color:var(--red)}
.streak-badge{font-size:.9rem;margin-left:.3em}
.btn-next{margin-top:1.2em;padding:.8em 2.5em;border-radius:8px;background:var(--azure);color:#fff;font-size:1rem;font-weight:700}
.correct-location{color:var(--text-dim);font-size:.85rem;margin-bottom:1em;background:var(--card);padding:.6em 1em;border-radius:8px}
.correct-location strong{color:var(--green)}

/* PODIUM */
#podium{background:linear-gradient(135deg,var(--bg) 0%,#1a0a2e 100%)}
.podium-container{text-align:center;width:min(700px,94vw)}
.podium-title{font-size:2rem;font-weight:900;margin-bottom:.5em}
.podium-blocks{display:flex;align-items:flex-end;justify-content:center;gap:.8em;margin:1.5em 0;height:250px}
.podium-block{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:12px 12px 0 0;animation:podiumRise .8s ease-out backwards;position:relative;padding:1em .8em .6em}
.podium-block.first{width:130px;height:220px;background:linear-gradient(180deg,#ffd93d 0%,#f7941d 100%);animation-delay:.3s}
.podium-block.second{width:110px;height:170px;background:linear-gradient(180deg,#c0c0c0 0%,#888 100%);animation-delay:.5s}
.podium-block.third{width:110px;height:130px;background:linear-gradient(180deg,#cd7f32 0%,#8b5e3c 100%);animation-delay:.7s}
@keyframes podiumRise{from{height:0;opacity:0}}
.podium-avatar{width:50px;height:50px;border-radius:50%;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;margin-bottom:.3em}
.podium-name{font-weight:700;font-size:.9rem;color:#fff}
.podium-score{font-size:.8rem;color:rgba(255,255,255,.8)}
.podium-rank{font-size:2rem;font-weight:900;color:rgba(255,255,255,.3);margin-top:.3em}
.full-leaderboard{margin-top:1.5em;max-height:200px;overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:.6em;padding:.4em .8em;border-radius:6px;margin-bottom:.3em;background:var(--card);font-size:.85rem}
.lb-pos{width:24px;font-weight:700;text-align:center}
.lb-name{flex:1;text-align:left}
.lb-score{font-weight:700;color:var(--yellow)}
.btn-home{margin-top:1.2em;padding:.7em 2em;border-radius:8px;background:#2a2a4a;color:#fff;font-size:.9rem;font-weight:600}

/* SOLO */
#solo{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)}
#solo-map{width:100%;flex:1}
.solo-ui{position:absolute;bottom:0;left:0;right:0;background:var(--card);padding:1em;z-index:500;border-radius:var(--radius) var(--radius) 0 0;max-height:45vh;overflow-y:auto}
.solo-score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6em}
.solo-score{font-size:1.3rem;font-weight:900;color:var(--yellow)}

/* CONFETTI */
.confetti-piece{position:fixed;width:10px;height:10px;z-index:99999;pointer-events:none;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

/* MOBILE */
@media(max-width:768px){
  #game{flex-direction:column}
  .answer-panel{width:100%;height:auto;max-height:45vh;border-left:none;border-top:1px solid #2a2a4a;border-radius:var(--radius) var(--radius) 0 0;position:absolute;bottom:0;z-index:500}
  .timer-container{top:auto;bottom:calc(45vh + 12px);right:12px}
  .room-code-display{font-size:2.5rem;letter-spacing:8px}
  .logo{font-size:2.2rem}
  .podium-blocks{height:200px}
  .podium-block.first{width:100px;height:180px}
  .podium-block.second{width:90px;height:140px}
  .podium-block.third{width:90px;height:110px}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="logo">Azure<span>Guessr</span></div>
  <div class="logo-sub">Multiplayer Geography Challenge</div>
  <div class="welcome-card">
    <input type="text" id="nameInput" placeholder="Enter your display name" maxlength="20" autofocus>
    <div class="btn-row">
      <button class="btn-primary" id="btnHost">Host Game</button>
      <button class="btn-secondary" id="btnJoin">Join Game</button>
    </div>
    <div class="room-input" id="joinRoomDiv">
      <input type="text" id="roomCodeInput" placeholder="ROOM CODE" maxlength="4">
      <button class="btn-primary" id="btnEnterRoom" style="width:100%;margin-top:.5em">Enter Room</button>
    </div>
    <button class="btn-solo" id="btnSolo">🌍 Solo Practice Mode</button>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen">
  <div class="lobby-container">
    <div class="logo" style="font-size:2rem">Azure<span>Guessr</span></div>
    <div class="room-code-label">ROOM CODE (tap to copy)</div>
    <div class="room-code-display" id="roomCodeDisplay">----</div>
    <div class="copied-toast" id="copiedToast">Copied!</div>
    <div class="mode-selector" id="modeSelector">
      <button class="mode-btn active" data-mode="classic">🎯 Classic (5)</button>
      <button class="mode-btn" data-mode="marathon">🏃 Marathon (10)</button>
      <button class="mode-btn" data-mode="speed">⚡ Speed (5×10s)</button>
    </div>
    <div class="player-count" id="playerCount">0 players</div>
    <div class="player-list" id="playerList"></div>
    <div class="lobby-actions">
      <button class="btn-start" id="btnStart" disabled>Start Game</button>
      <button class="btn-leave" id="btnLeave">Leave</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="map-container">
    <div id="map"></div>
    <div class="round-badge" id="roundBadge">Round 1/5</div>
    <div class="timer-container">
      <div style="position:relative">
        <svg class="timer-ring" viewBox="0 0 80 80">
          <circle class="timer-bg" cx="40" cy="40" r="36"/>
          <circle class="timer-fg" id="timerFg" cx="40" cy="40" r="36" stroke-dasharray="226.2" stroke-dashoffset="0" transform="rotate(-90 40 40)"/>
        </svg>
        <div class="timer-text" id="timerText">30</div>
      </div>
    </div>
  </div>
  <div class="answer-panel" id="answerPanel">
    <h3>📍 Where is this?</h3>
    <div class="answer-field unlocked" id="fieldContinent">
      <label>Continent</label>
      <select id="inputContinent">
        <option value="">Select...</option>
        <option>Africa</option><option>Asia</option><option>Europe</option>
        <option>North America</option><option>Oceania</option><option>South America</option>
      </select>
      <div class="field-status" id="statusContinent"></div>
    </div>
    <div class="answer-field" id="fieldCountry">
      <label>Country</label>
      <input type="text" id="inputCountry" placeholder="Type country name...">
      <div class="field-status" id="statusCountry"></div>
    </div>
    <div class="answer-field" id="fieldProvince">
      <label>Province / State</label>
      <input type="text" id="inputProvince" placeholder="Type province or state...">
      <div class="field-status" id="statusProvince"></div>
    </div>
    <div class="answer-field" id="fieldCity">
      <label>City</label>
      <input type="text" id="inputCity" placeholder="Type city name...">
      <div class="field-status" id="statusCity"></div>
    </div>
    <button class="btn-submit" id="btnSubmit">Submit Answer</button>
    <div class="mini-scores" id="miniScores">
      <h4>Scoreboard</h4>
    </div>
  </div>
</div>

<!-- ROUND RESULTS -->
<div id="results" class="screen">
  <div class="results-container">
    <h2>Round Results</h2>
    <div class="round-label" id="resultsRoundLabel">Round 1 of 5</div>
    <div class="correct-location" id="correctLocation"></div>
    <div id="resultRows"></div>
    <button class="btn-next" id="btnNextRound">Next Round →</button>
  </div>
</div>

<!-- PODIUM -->
<div id="podium" class="screen">
  <div class="podium-container">
    <div class="podium-title">🏆 Final Results</div>
    <div class="podium-blocks" id="podiumBlocks"></div>
    <div class="full-leaderboard" id="fullLeaderboard"></div>
    <button class="btn-home" id="btnHome">🏠 Back to Home</button>
  </div>
</div>

<!-- SOLO MODE -->
<div id="solo" class="screen">
  <div id="solo-map" style="flex:1;width:100%"></div>
  <div class="solo-ui" id="soloUI">
    <div class="solo-score-bar">
      <span id="soloRound">Round 1</span>
      <span class="solo-score" id="soloScore">0 pts</span>
      <button class="btn-leave" id="btnSoloQuit" style="padding:.4em .8em;font-size:.8rem">Quit</button>
    </div>
    <div class="answer-field unlocked" id="soloFieldContinent">
      <label>Continent</label>
      <select id="soloContinent"><option value="">Select...</option><option>Africa</option><option>Asia</option><option>Europe</option><option>North America</option><option>Oceania</option><option>South America</option></select>
      <div class="field-status" id="soloStatusContinent"></div>
    </div>
    <div class="answer-field" id="soloFieldCountry">
      <label>Country</label>
      <input type="text" id="soloCountry" placeholder="Country...">
      <div class="field-status" id="soloStatusCountry"></div>
    </div>
    <div class="answer-field" id="soloFieldProvince">
      <label>Province / State</label>
      <input type="text" id="soloProvince" placeholder="Province or state...">
      <div class="field-status" id="soloStatusProvince"></div>
    </div>
    <div class="answer-field" id="soloFieldCity">
      <label>City</label>
      <input type="text" id="soloCity" placeholder="City...">
      <div class="field-status" id="soloStatusCity"></div>
    </div>
    <button class="btn-submit" id="btnSoloSubmit">Submit</button>
  </div>
</div>

// ==================== AUDIO ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTick() {
  ensureAudio();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 880; o.type = 'sine';
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  o.start(); o.stop(audioCtx.currentTime + 0.08);
}
function playCorrect() {
  ensureAudio();
  [523.25, 659.25, 783.99].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f; o.type = 'sine';
    const t = audioCtx.currentTime + i * 0.1;
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.start(t); o.stop(t + 0.2);
  });
}
function playWrong() {
  ensureAudio();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 200; o.type = 'square';
  g.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  o.start(); o.stop(audioCtx.currentTime + 0.3);
}
function playVictory() {
  ensureAudio();
  const notes = [523.25,659.25,783.99,1046.5,783.99,1046.5];
  notes.forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f; o.type = 'sine';
    const t = audioCtx.currentTime + i * 0.15;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.start(t); o.stop(t + 0.25);
  });
}

// ==================== HELPERS ====================
function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = ((h << 5) - h + seed.charCodeAt(i)) | 0; }
  return function() { h = (h * 16807 + 0) % 2147483647; return (h & 0x7fffffff) / 0x7fffffff; };
}
function selectLocations(seed, count) {
  const rng = seededRandom(seed);
  const shuffled = [...UNIQUE_LOCATIONS].sort(() => rng() - 0.5);
  return shuffled.slice(0, count);
}
function normalizeStr(s) { return (s || '').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function matchCountry(input, correct) {
  const n = normalizeStr(input);
  const c = normalizeStr(correct);
  if (n === c) return true;
  if (COUNTRY_ALIASES[n] === c) return true;
  if (n.length > 2 && c.includes(n)) return true;
  return false;
}
function matchText(input, correct) {
  const n = normalizeStr(input);
  const c = normalizeStr(correct);
  if (!n) return false;
  if (n === c) return true;
  if (c.includes(n) && n.length >= 3) return true;
  if (n.includes(c) && c.length >= 3) return true;
  // Levenshtein for close matches
  if (n.length > 3 && c.length > 3) {
    let dist = levenshtein(n, c);
    if (dist <= 2) return true;
  }
  return false;
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, ()=>Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) {
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));
  }
  return dp[m][n];
}

// ==================== CREATE ROOM ====================
async function createRoom() {
  const code = generateRoomCode();
  state.roomCode = code;
  state.isHost = true;
  state.mode = 'classic';
  const modeConf = MODES[state.mode];

  await db.collection('rooms').doc(code).set({
    hostId: state.playerId,
    mode: state.mode,
    status: 'lobby',
    currentRound: 0,
    totalRounds: modeConf.rounds,
    locationSeed: code + Date.now(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    settings: { timePerRound: modeConf.time }
  });

  await db.collection('rooms').doc(code).collection('players').doc(state.playerId).set({
    displayName: state.displayName,
    score: 0,
    streak: 0,
    answers: [],
    color: PLAYER_COLORS[0],
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  showScreen('lobby');
  setupLobbyListeners();
}

// ==================== JOIN ROOM ====================
async function joinRoom(code) {
  const roomDoc = await db.collection('rooms').doc(code).get();
  if (!roomDoc.exists) { alert('Room not found!'); return; }
  const room = roomDoc.data();
  if (room.status !== 'lobby') { alert('Game already in progress!'); return; }

  state.roomCode = code;
  state.isHost = false;

  const playersSnap = await db.collection('rooms').doc(code).collection('players').get();
  const colorIndex = playersSnap.size % PLAYER_COLORS.length;

  await db.collection('rooms').doc(code).collection('players').doc(state.playerId).set({
    displayName: state.displayName,
    score: 0,
    streak: 0,
    answers: [],
    color: PLAYER_COLORS[colorIndex],
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  showScreen('lobby');
  setupLobbyListeners();
}

// ==================== LOBBY ====================
function setupLobbyListeners() {
  const code = state.roomCode;
  document.getElementById('roomCodeDisplay').textContent = code;
  document.getElementById('modeSelector').style.display = state.isHost ? 'flex' : 'none';

  // Copy room code
  document.getElementById('roomCodeDisplay').onclick = () => {
    navigator.clipboard.writeText(code).catch(() => {});
    const toast = document.getElementById('copiedToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  };

  // Mode selector (host only)
  if (state.isHost) {
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
        const mc = MODES[state.mode];
        await db.collection('rooms').doc(code).update({
          mode: state.mode,
          totalRounds: mc.rounds,
          settings: { timePerRound: mc.time }
        });
      });
    });
  }

  // Players listener
  const unsub1 = db.collection('rooms').doc(code).collection('players').onSnapshot(snap => {
    const list = document.getElementById('playerList');
    const players = [];
    snap.forEach(doc => { players.push({ id: doc.id, ...doc.data() }); });
    state.players = players;
    list.innerHTML = '';
    players.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'player-chip';
      chip.innerHTML = `<div class="avatar" style="background:${p.color}">${getInitials(p.displayName)}</div><span>${p.displayName}${p.id === state.playerId ? ' (you)' : ''}</span>`;
      list.appendChild(chip);
    });
    document.getElementById('playerCount').textContent = players.length + ' player' + (players.length !== 1 ? 's' : '');
    document.getElementById('btnStart').disabled = !state.isHost || players.length < 1;
  });
  state.unsubscribers.push(unsub1);

  // Room status listener (for non-hosts to detect game start)
  const unsub2 = db.collection('rooms').doc(code).onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.status === 'playing' && !state.isHost) {
      state.totalRounds = data.totalRounds;
      state.timePerRound = data.settings.timePerRound;
      state.mode = data.mode;
      startGameAsPlayer(data);
    }
  });
  state.unsubscribers.push(unsub2);

  // Start button (host)
  document.getElementById('btnStart').onclick = async () => {
    if (!state.isHost) return;
    const mc = MODES[state.mode];
    state.totalRounds = mc.rounds;
    state.timePerRound = mc.time;
    await db.collection('rooms').doc(code).update({ status: 'playing', currentRound: 1 });
    startGameRound(1);
  };

  // Leave button
  document.getElementById('btnLeave').onclick = async () => {
    await db.collection('rooms').doc(code).collection('players').doc(state.playerId).delete();
    cleanupListeners();
    showScreen('welcome');
  };
}

function cleanupListeners() {
  state.unsubscribers.forEach(u => u());
  state.unsubscribers = [];
  if (state.timerInterval) clearInterval(state.timerInterval);
}

// ==================== START GAME ====================
async function startGameAsPlayer(roomData) {
  const seed = roomData.locationSeed;
  state.locations = selectLocations(seed, roomData.totalRounds);
  startGameRound(roomData.currentRound);
}

async function startGameRound(roundNum) {
  state.currentRound = roundNum;
  state.submitted = false;
  state.roundScore = 0;
  state.answers = { continent: null, country: null, province: null, city: null };
  state.correctLevels = { continent: false, country: false, province: false, city: false };
  state.levelTimestamps = {};

  // Get room data for seed if host
  if (state.isHost && !state.locations) {
    const roomSnap = await db.collection('rooms').doc(state.roomCode).get();
    const seed = roomSnap.data().locationSeed;
    state.locations = selectLocations(seed, state.totalRounds);
  }

  const loc = state.locations[roundNum - 1];
  state.currentLocation = loc;
  state.roundStartTime = Date.now();

  showScreen('game');
  setTimeout(() => {
    if (state.gameMap) state.gameMap.invalidateSize();
    state.gameMap.setView([loc.lat, loc.lng], 11 + Math.floor(Math.random() * 3));
  }, 100);

  document.getElementById('roundBadge').textContent = `Round ${roundNum}/${state.totalRounds}`;

  // Reset answer fields
  resetAnswerFields();

  // Start timer
  startTimer(state.timePerRound);

  // Enable submit
  document.getElementById('btnSubmit').disabled = false;
  document.getElementById('btnSubmit').textContent = 'Submit Answer';

  // Listen for round completion
  setupRoundListeners();
  updateMiniScores();
}

function resetAnswerFields() {

// ==================== ANSWER CHECKING ====================
document.getElementById('inputContinent').addEventListener('change', () => checkAnswer('continent'));
document.getElementById('inputCountry').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer('country'); });
document.getElementById('inputProvince').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer('province'); });
document.getElementById('inputCity').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer('city'); });

// Also check on blur
document.getElementById('inputCountry').addEventListener('blur', () => { if (document.getElementById('inputCountry').value.trim()) checkAnswer('country'); });
document.getElementById('inputProvince').addEventListener('blur', () => { if (document.getElementById('inputProvince').value.trim()) checkAnswer('province'); });
document.getElementById('inputCity').addEventListener('blur', () => { if (document.getElementById('inputCity').value.trim()) checkAnswer('city'); });

function checkAnswer(level) {
  if (state.submitted || !state.currentLocation) return;
  const loc = state.currentLocation;
  let input, correct, fieldId, statusId, nextFieldId, isCorrect;

  switch(level) {
    case 'continent':
      input = document.getElementById('inputContinent').value;
      correct = loc.continent;
      fieldId = 'fieldContinent';
      statusId = 'statusContinent';
      nextFieldId = 'fieldCountry';
      isCorrect = normalizeStr(input) === normalizeStr(correct);
      break;
    case 'country':
      input = document.getElementById('inputCountry').value;
      correct = loc.country;
      fieldId = 'fieldCountry';
      statusId = 'statusCountry';
      nextFieldId = 'fieldProvince';
      isCorrect = matchCountry(input, correct);
      break;
    case 'province':
      input = document.getElementById('inputProvince').value;
      correct = loc.province;
      fieldId = 'fieldProvince';
      statusId = 'statusProvince';
      nextFieldId = 'fieldCity';
      isCorrect = matchText(input, correct);
      break;
    case 'city':
      input = document.getElementById('inputCity').value;
      correct = loc.city;
      fieldId = 'fieldCity';
      statusId = 'statusCity';
      nextFieldId = null;
      isCorrect = matchText(input, correct);
      break;
  }

  if (!input) return;

  const field = document.getElementById(fieldId);
  const status = document.getElementById(statusId);

  if (isCorrect) {
    field.classList.add('correct');
    field.classList.remove('wrong');
    status.textContent = '✓ Correct!';
    state.correctLevels[level] = true;
    state.levelTimestamps[level] = Date.now();
    playCorrect();
    // Calculate points
    const elapsed = (Date.now() - state.roundStartTime) / 1000;
    const remaining = Math.max(0, state.timePerRound - elapsed);
    const pts = calculateLevelPoints(level, remaining, state.timePerRound);
    state.roundScore += pts;
    const rect = field.getBoundingClientRect();
    showPointsPopup('+' + pts, rect.right - 60, rect.top);
    // Unlock next field
    if (nextFieldId) {
      const next = document.getElementById(nextFieldId);
      next.classList.add('unlocked');
      const nextInput = next.querySelector('input');
      if (nextInput) setTimeout(() => nextInput.focus(), 100);
    }
  } else {
    field.classList.add('wrong');
    field.classList.remove('correct');
    status.textContent = '✗ Try again...';
    playWrong();
  }
}

function calculateLevelPoints(level, timeRemaining, totalTime) {
  const config = {
    continent: { base: 500, speedMax: 500 },
    country: { base: 750, speedMax: 750 },
    province: { base: 750, speedMax: 500 },
    city: { base: 750, speedMax: 500 }
  };
  const c = config[level];
  const speedBonus = Math.round(c.speedMax * (timeRemaining / totalTime));
  return c.base + speedBonus;
}

// ==================== SUBMIT ====================
document.getElementById('btnSubmit').addEventListener('click', submitAnswer);

async function submitAnswer() {
  if (state.submitted) return;
  state.submitted = true;
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnSubmit').textContent = 'Submitted ✓';

  // Get streak
  const playerRef = db.collection('rooms').doc(state.roomCode).collection('players').doc(state.playerId);
  const playerSnap = await playerRef.get();
  let streak = (playerSnap.data().streak || 0);
  const allCorrect = state.correctLevels.continent && state.correctLevels.country && state.correctLevels.province && state.correctLevels.city;

  if (allCorrect) {
    streak++;
  } else {
    streak = 0;
  }

  // Streak multiplier
  let multiplier = 1;
  if (streak >= 5) multiplier = 3;
  else if (streak >= 3) multiplier = 2;

  const finalScore = state.roundScore * multiplier;

  await playerRef.update({
    score: firebase.firestore.FieldValue.increment(finalScore),
    streak: streak,
    [`roundScores.round${state.currentRound}`]: {
      points: finalScore,
      correct: state.correctLevels,
      multiplier
    }
  });
}

// ==================== TIMER ====================
function startTimer(seconds) {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timeRemaining = seconds;
  const total = seconds;
  const fg = document.getElementById('timerFg');
  const txt = document.getElementById('timerText');

  fg.style.strokeDashoffset = '0';
  fg.classList.remove('danger');
  txt.textContent = seconds;

  state.timerInterval = setInterval(() => {
    state.timeRemaining--;
    txt.textContent = state.timeRemaining;
    const progress = 1 - (state.timeRemaining / total);
    fg.style.strokeDashoffset = (progress * CIRCUMFERENCE).toFixed(1);

    if (state.timeRemaining <= 5) {
      fg.classList.add('danger');
      playTick();
    }

    if (state.timeRemaining <= 0) {
      clearInterval(state.timerInterval);
      if (!state.submitted) submitAnswer();
      // Host triggers round end
      if (state.isHost) {
        setTimeout(() => endRound(), 1500);
      }
    }
  }, 1000);
}

// ==================== ROUND END ====================
async function endRound() {
  if (state.timerInterval) clearInterval(state.timerInterval);

  // Mark round complete in Firestore
  if (state.isHost) {
    await db.collection('rooms').doc(state.roomCode).update({
      status: state.currentRound >= state.totalRounds ? 'finished' : 'results',
      currentRound: state.currentRound
    });
  }
}

function setupRoundListeners() {
  // Listen for room status changes (results / finished)
  const unsub = db.collection('rooms').doc(state.roomCode).onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.status === 'results' && data.currentRound === state.currentRound) {
      showRoundResults();
    } else if (data.status === 'finished') {
      showPodium();
    } else if (data.status === 'playing' && data.currentRound > state.currentRound) {
      startGameRound(data.currentRound);
    }
  });
  state.unsubscribers.push(unsub);
}

async function showRoundResults() {
  if (state.timerInterval) clearInterval(state.timerInterval);

  const playersSnap = await db.collection('rooms').doc(state.roomCode).collection('players').get();
  const players = [];
  playersSnap.forEach(doc => players.push({ id: doc.id, ...doc.data() }));
  players.sort((a, b) => b.score - a.score);

  const loc = state.currentLocation;
  document.getElementById('resultsRoundLabel').textContent = `Round ${state.currentRound} of ${state.totalRounds}`;
  document.getElementById('correctLocation').innerHTML = `Answer: <strong>${loc.city}, ${loc.province}, ${loc.country}</strong> (${loc.continent})`;

  const rows = document.getElementById('resultRows');
  rows.innerHTML = '';

  players.forEach((p, i) => {
    const roundData = p.roundScores && p.roundScores['round' + state.currentRound];
    const pts = roundData ? roundData.points : 0;
    const mult = roundData && roundData.multiplier > 1 ? ` (${roundData.multiplier}x)` : '';
    const prevPos = state.previousPositions[p.id] ?? i;
    const posChange = prevPos - i;
    let posArrow = '';
    if (posChange > 0) posArrow = `<span class="pos-up">▲${posChange}</span>`;
    else if (posChange < 0) posArrow = `<span class="pos-down">▼${Math.abs(posChange)}</span>`;

    const streakEmoji = p.streak >= 5 ? '🔥🔥🔥' : p.streak >= 3 ? '🔥🔥' : p.streak >= 1 ? '🔥' : '';

    const row = document.createElement('div');
    row.className = 'result-row';
    row.style.animationDelay = (i * 0.1) + 's';
    row.innerHTML = `
      <div class="result-pos">#${i + 1}</div>
      <div class="avatar" style="background:${p.color};width:32px;height:32px;font-size:.75rem">${getInitials(p.displayName)}</div>
      <div class="result-info">
        <div class="result-name">${p.displayName}${p.id === state.playerId ? ' (you)' : ''} <span class="streak-badge">${streakEmoji}</span></div>
        <div class="result-answer">+${pts}${mult}</div>
      </div>
      <div>
        <div class="result-points">${p.score.toLocaleString()}</div>
      </div>
      <div class="pos-change">${posArrow}</div>
    `;
    rows.appendChild(row);
    state.previousPositions[p.id] = i;
  });

  // Next button (host) or waiting text
  const btnNext = document.getElementById('btnNextRound');
  if (state.isHost) {
    btnNext.textContent = state.currentRound >= state.totalRounds ? 'Show Results 🏆' : 'Next Round →';
    btnNext.style.display = 'inline-block';
    btnNext.onclick = async () => {
      if (state.currentRound >= state.totalRounds) {
        await db.collection('rooms').doc(state.roomCode).update({ status: 'finished' });
      } else {
        await db.collection('rooms').doc(state.roomCode).update({
          status: 'playing',
          currentRound: state.currentRound + 1
        });
      }
    };
  } else {
    btnNext.textContent = 'Waiting for host...';
    btnNext.style.display = 'inline-block';
    btnNext.onclick = null;
  }

  showScreen('results');
}

function checkSoloAnswer(level) {
  if (!state.currentLocation) return;
  const loc = state.currentLocation;
  const map = {
    continent: { input: 'soloContinent', field: 'soloFieldContinent', status: 'soloStatusContinent', next: 'soloFieldCountry', correct: loc.continent, match: (i,c) => normalizeStr(i) === normalizeStr(c) },
    country: { input: 'soloCountry', field: 'soloFieldCountry', status: 'soloStatusCountry', next: 'soloFieldProvince', correct: loc.country, match: matchCountry },
    province: { input: 'soloProvince', field: 'soloFieldProvince', status: 'soloStatusProvince', next: 'soloFieldCity', correct: loc.province, match: matchText },
    city: { input: 'soloCity', field: 'soloFieldCity', status: 'soloStatusCity', next: null, correct: loc.city, match: matchText }
  };
  const m = map[level];
  const input = document.getElementById(m.input).value;
  if (!input) return;

  const isCorrect = m.match(input, m.correct);
  const field = document.getElementById(m.field);
  const status = document.getElementById(m.status);

  if (isCorrect) {
    field.classList.add('correct');
    field.classList.remove('wrong');
    status.textContent = '✓ Correct!';
    state.correctLevels[level] = true;
    playCorrect();
    const elapsed = (Date.now() - state.roundStartTime) / 1000;
    const remaining = Math.max(0, 30 - elapsed);
    const pts = calculateLevelPoints(level, remaining, 30);
    state.roundScore += pts;
    const rect = field.getBoundingClientRect();
    showPointsPopup('+' + pts, rect.right - 60, rect.top);
    if (m.next) {
      document.getElementById(m.next).classList.add('unlocked');
      const ni = document.getElementById(m.next).querySelector('input');
      if (ni) setTimeout(() => ni.focus(), 100);
    }
  } else {
    field.classList.add('wrong');
    field.classList.remove('correct');
    status.textContent = '✗ Try again...';
    playWrong();
  }
}
